<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BudgetLens</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme & App Color -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BudgetLens" />

  <!-- Icons -->
  <link rel="icon" type="image/jpeg" href="/icon-512.jpg" />
  <link rel="apple-touch-icon" href="/icon-512.jpg" />

  <!-- SEO -->
  <meta name="description"
    content="BudgetLens — your personal cash flow dashboard. Track income, expenses, and see exactly how long your money lasts." />
  <meta name="application-name" content="BudgetLens" />
  <meta name="keywords" content="budget, finance, cash flow, expense tracker, personal finance dashboard" />

  <!-- Open Graph -->
  <meta property="og:title" content="BudgetLens — Cash Flow in Focus" />
  <meta property="og:description" content="Visualize your income, expenses, and cash runway at a glance." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icon-512.jpg" />

  <!-- Fonts: Plus Jakarta Sans & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
